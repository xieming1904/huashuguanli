<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售话术管理助手</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-primary-light">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar-glass w-64 space-y-6 py-7 px-2 flex flex-col fixed md:static md:translate-x-0 transform -translate-x-full md:z-auto z-40 transition-transform duration-300 ease-in-out">
            <div class="text-white text-2xl font-semibold px-4 flex items-center">
                <i class="fas fa-headset mr-3 text-primary"></i>
                <span class="text-on-primary-light">销售助手</span>
            </div>
            <nav class="mt-6 flex-1">
                <a href="#" id="navTalkTrackManagement" class="sidebar-nav-item group flex items-center py-2.5 px-4 rounded transition duration-200">
                    <i class="fas fa-list-alt mr-3 text-gray-300 group-hover:text-secondary transition-colors"></i>话术管理
                </a>
                <a href="#" id="navFacebookChat" class="sidebar-nav-item group flex items-center py-2.5 px-4 rounded transition duration-200">
                    <i class="fab fa-facebook-messenger mr-3 text-gray-300 group-hover:text-secondary transition-colors"></i>Facebook聊天
                </a>
                <a href="#" id="navDataAnalysis" class="sidebar-nav-item group flex items-center py-2.5 px-4 rounded transition duration-200">
                    <i class="fas fa-chart-line mr-3 text-gray-300 group-hover:text-secondary transition-colors"></i>数据分析
                </a>
            </nav>
            <div class="px-4 py-2 mt-auto">
                <p class="text-xs text-gray-400">&copy; 2024 销售助手</p>
            </div>
        </aside>

        <!-- Main content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="header-style shadow-md sticky top-0 z-30">
                <div class="container mx-auto px-4 sm:px-6 py-3 flex justify-between items-center">
                    <button id="sidebarToggleBtn" class="md:hidden text-gray-600 hover:text-primary-darker focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 id="mainHeaderTitle" class="header-title text-xl sm:text-2xl">销售话术管理助手</h1>
                    <div>
                        <i class="fas fa-user-circle text-2xl text-primary-dark cursor-pointer hover:text-primary-darker transition-colors"></i>
                    </div>
                </div>
            </header>

            <!-- Content area -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto p-4 sm:p-6 bg-gray-50">
                <!-- Talk Track Management View -->
                <div id="talkTrackManagementView">
                    <div class="container mx-auto">
                        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-3">
                            <h2 class="text-2xl font-semibold text-gray-700">我的话术库</h2>
                            <button id="addTalkTrackBtn" class="btn-primary py-2 px-4 rounded-lg shadow hover:shadow-md flex items-center w-full sm:w-auto justify-center">
                                <i class="fas fa-plus mr-2"></i>添加新话术
                            </button>
                        </div>
                        <div id="talkTracksContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            <!-- Talk track cards will be dynamically injected here -->
                        </div>
                    </div>
                </div>

                <!-- Facebook Chat View -->
                <div id="facebookChatView" class="hidden h-full flex flex-col p-0 m-0">
                    <div class="flex flex-1 overflow-hidden h-full">
                        <!-- Customer List Panel (Left) -->
                        <aside class="w-full sm:w-1/3 md:w-1/4 glass-effect p-4 border-r border-gray-200/50 overflow-y-auto">
                            <h3 class="text-xl font-semibold text-gray-800 mb-4">聊天客户</h3>
                            <ul id="customerList" class="space-y-2">
                                <li class="p-3 rounded-lg glass-effect hover:bg-primary-light/50 cursor-pointer transition-all duration-200 ease-in-out" data-customer="Customer A"><i class="fas fa-user-astronaut mr-2 text-primary"></i>Customer A</li>
                                <li class="p-3 rounded-lg glass-effect hover:bg-primary-light/50 cursor-pointer transition-all duration-200 ease-in-out" data-customer="Customer B"><i class="fas fa-user-ninja mr-2 text-accent"></i>Customer B</li>
                                <li class="p-3 rounded-lg glass-effect hover:bg-primary-light/50 cursor-pointer transition-all duration-200 ease-in-out" data-customer="Customer C"><i class="fas fa-user-tie mr-2 text-green-500"></i>Customer C</li>
                            </ul>
                        </aside>

                        <!-- Chat Conversation Panel (Right) -->
                        <section class="flex-1 flex flex-col bg-white/30 backdrop-filter backdrop-blur-sm">
                            <div id="chatHeader" class="p-4 border-b border-primary-light/50 bg-white/10">
                                <h4 id="currentChatCustomerName" class="font-semibold text-gray-700 text-lg">Customer A</h4>
                            </div>
                            <div id="chatMessages" class="flex-1 p-4 space-y-4 overflow-y-auto">
                                <!-- Messages will appear here -->
                            </div>
                            <div class="p-4 bg-white/10 border-t border-primary-light/50">
                                <div class="flex items-center space-x-2">
                                    <input type="text" id="chatInput" class="form-input flex-1 rounded-full focus:ring-primary-dark focus:border-primary-dark" placeholder="输入消息...">
                                    <button id="sendChatMessageBtn" class="btn-primary p-3 rounded-full shadow-md hover:shadow-lg">
                                        <i class="fas fa-paper-plane"></i>
                                    </button>
                                    <div class="relative">
                                        <button id="selectTalkTrackChatBtn" class="bg-green-500 hover:bg-green-600 text-white p-3 rounded-full shadow-md hover:shadow-lg">
                                            <i class="fas fa-comment-dots"></i>
                                        </button>
                                        <div id="chatTalkTrackDropdown" class="absolute bottom-full right-0 mb-2 w-72 glass-effect p-2 shadow-xl hidden overflow-y-auto max-h-60 z-20">
                                            <!-- Talk tracks will be populated here by JS -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>

                <!-- Data Analysis View -->
                <div id="dataAnalysisView" class="hidden">
                    <div class="container mx-auto">
                        <h2 class="text-2xl font-semibold text-gray-700 mb-6">数据洞察</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                            <div class="glass-effect p-6 text-center">
                                <h4 class="text-lg font-semibold text-gray-600 mb-2">总话术数</h4>
                                <p id="metricTotalTalkTracks" class="text-4xl font-bold text-primary-darker">0</p>
                            </div>
                            <div class="glass-effect p-6 text-center">
                                <h4 class="text-lg font-semibold text-gray-600 mb-2">常用话术</h4>
                                <p id="metricFavoriteTalkTracks" class="text-4xl font-bold text-pink-500">0</p>
                            </div>
                            <div class="glass-effect p-6 text-center">
                                <h4 class="text-lg font-semibold text-gray-600 mb-2">本月新增 (示例)</h4>
                                <p id="metricAddedThisMonth" class="text-4xl font-bold text-green-600">0</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div class="glass-effect p-6 min-h-[20rem] flex flex-col items-center justify-center">
                                <h4 class="text-lg font-semibold text-gray-600 mb-4 text-center">转化率趋势分析</h4>
                                <i class="fas fa-chart-area text-6xl text-gray-400 mb-4"></i>
                                <p class="text-gray-500">图表占位符</p>
                            </div>
                            <div class="glass-effect p-6 min-h-[20rem] flex flex-col items-center justify-center">
                                <h4 class="text-lg font-semibold text-gray-600 mb-4 text-center">话术使用效果</h4>
                                 <i class="fas fa-tasks text-6xl text-gray-400 mb-4"></i>
                                <p class="text-gray-500">图表占位符</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add/Edit Talk Track Modal -->
    <div id="talkTrackModal" class="fixed inset-0 bg-black bg-opacity-50 backdrop-filter backdrop-blur-sm flex items-center justify-center p-4 hidden modal-transition modal-hidden z-50">
        <div class="glass-effect p-6 sm:p-8 rounded-xl shadow-xl w-full max-w-lg transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modalTitle" class="text-2xl font-semibold text-gray-700">添加新话术</h2>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-700 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="talkTrackForm">
                <div class="mb-4">
                    <label for="trackTitle" class="block text-sm font-medium text-gray-600 mb-1">标题</label>
                    <input type="text" id="trackTitle" name="trackTitle" class="form-input w-full bg-white/70" required>
                </div>
                <div class="mb-4">
                    <label for="trackContent" class="block text-sm font-medium text-gray-600 mb-1">内容</label>
                    <textarea id="trackContent" name="trackContent" rows="5" class="form-textarea w-full bg-white/70" required></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label for="trackCategory" class="block text-sm font-medium text-gray-600 mb-1">分类</label>
                        <input type="text" id="trackCategory" name="trackCategory" class="form-input w-full bg-white/70">
                    </div>
                    <div>
                        <label for="trackKeywords" class="block text-sm font-medium text-gray-600 mb-1">关键词 (逗号分隔)</label>
                        <input type="text" id="trackKeywords" name="trackKeywords" class="form-input w-full bg-white/70">
                    </div>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancelModalBtn" class="btn-secondary py-2 px-5 rounded-lg">
                        取消
                    </button>
                    <button type="submit" id="saveTrackBtn" class="btn-primary py-2 px-5 rounded-lg">
                        保存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
